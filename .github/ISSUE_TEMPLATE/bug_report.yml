name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw HTML dumps and the Scraper
        API's `x-debug` header do not. Replace them with `***`.

        Two things answer most reports faster than we can:

        - **Everything exit 3?** Read which state the log names. A
          `login_wall` (HTTP 403, `请登录后使用`) wants an ACCOUNT, and no
          proxy, exit country or captcha key changes it — this repo does not
          implement login. The three modes here needed none of those,
          measured from a datacentre address; see the README.
        - **HTTP 403 with 21 bytes, `{"error":"Forbidden"}`?** That is an
          `/ajax/` URL fetched as a top-level navigation, which Weibo
          declines. It is the wrong kind of request, not a block. It is also
          what `scraper_api_client.py` gets on these URLs, measured.
        - **Zero rows?** A hot feed, account or post that holds nothing
          answers with an empty list, which is exit 4 and a correct answer.
        - **Fewer posts than the account claims in `--mode user`?** The
          cursor walk ends where the site says `-1`, and the sidecar records
          `statuses_claimed` beside `products` for that reason. See the
          README.

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - scraper_api_client.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - No browser (scraper_api_client.py over plain HTTP)
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things — 3 is
        blocked (on Weibo, usually a login wall), 4 is "ran fine, found
        nothing", 5 is "the content was never obtained". The table is in the
        README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py \
          --mode user --url "https://weibo.com/u/2803301701" \
          --pages 3 --out weibo_posts
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        The posts the account's page shows, with their full text.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|beautifulsoup4|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true
