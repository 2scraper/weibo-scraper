name: Site changed / parser broke
description: Weibo changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        weibo.com moved.

        Useful to know before filing: this repo parses **no HTML**. Every mode
        reads the JSON that Weibo's own front end fetches from `/ajax/`
        endpoints (`/ajax/feed/hottimeline`,
        `/ajax/profile/getWaterFallContent`, `/ajax/statuses/buildComments`,
        and `/ajax/statuses/longtext` for truncated bodies). Which endpoint and
        which field changed narrows the fix a lot.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Rows (0 rows from an account or post that visibly has content)
        - A specific field is null or wrong (text, counts, author, region, media)
        - Post bodies cut off at about 150 characters (`text_source` / `text_truncated`)
        - The cursor stops early or repeats a page in --mode user or --mode post
        - The visitor handshake fails (`needs_visitor` on every attempt)
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL and mode
      description: The exact URL, the --mode, and where your exit IP was.
      placeholder: "--mode user --url https://weibo.com/u/2803301701 (exit IP: FI datacentre)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Whichever of these you can get. A capture beats a description.

        - The `--dump-html PATH` snapshot: the exact bytes the parser was given.
        - The endpoint's JSON as devtools shows it (Network tab, the `/ajax/`
          request), trimmed to one post.
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different exit, and when it last worked.
